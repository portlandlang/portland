[package]
name = "portland"
version = "0.0.0"
edition = "2024"
description = "Placeholder for Portland, a joyous programming language for Apple silicon. Nothing here yet."
homepage = "https://github.com/portlandlang"
repository = "https://github.com/portlandlang"
license = "MIT"
keywords = ["portland", "language", "compiler", "apple-silicon"]
categories = ["compilers"]

# A name squat with three lines of doc comment in it (see AGENT.md), so it has
# no tests and never will. Saying so keeps `cargo test` from announcing two
# empty test targets in the middle of the suite's progress dots.
[lib]
test = false
doctest = false

