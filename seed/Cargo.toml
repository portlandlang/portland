[package]
name = "portland-seed"
version = "0.0.0"
edition = "2024"
description = "Stage 0 seed compiler for Portland. Crude and disposable on purpose. Never published."
publish = false

# Recorded rather than silent (principle 4): doc-tests are off, so a rustdoc
# `///` example in the seed would not be compiled or run. The seed is
# `publish = false` and disposable, its docs are never rendered, and it has
# never used a doc example — the markdown code blocks that do get checked live
# in docs/ and are covered by script/docs/check. The trade buys back the empty
# `Doc-tests portland_seed` block in the middle of the progress dots.
[lib]
doctest = false

[[bin]]
name = "pdx"
path = "src/main.rs"

[dependencies]
# The floor's two syscalls (ADR 0068): `clock_gettime` for the clocks and
# `getentropy` for `System.entropy`. Rust's `std` reads neither out loud —
# its random source is private, and `Instant` has no absolute reading — so
# the seed declares them through libc, which rustyline already pulls in.
libc = "0.2.189"
# The regex engine (ADR 0086, #212): oniai, a pure-Rust Onigmo, pinned to a
# commit and without its Cranelift JIT. Unlicensed as of this pin, which is
# why this sits on a branch; the choice of engine is #212's to make.
oniai = { git = "https://github.com/makenowjust/oniai", rev = "c2f332ed65d94887a268bbfd16dc3076dc0dc79d", default-features = false }
rustyline = "18.0.1"
# The Unicode floor for ADR 0038: what a character is (grapheme clusters)
# and when two strings are equal (canonical equivalence). Prior art over
# inventing (principle 10) — these are the reference implementations.
unicode-normalization = "0.1.25"
unicode-segmentation = "1.13.3"
