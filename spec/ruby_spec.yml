# Which ruby/spec files Portland's spec suite has taken in, and how far.
#
# The dashboard at portlandlang.com reads this through
# script/ruby_spec_dashboard, which walks a ruby/spec checkout and gives every
# upstream spec file one status:
#
#   passing              imported; every mapped pdx spec passes on both oracles
#   failing              imported; a mapped pdx spec fails on either oracle
#   partial_planned      imported in part; the rest is owed (reason, and an
#                        issue or ADR where one exists)
#   partial_intentional  imported in part; the rest stays behind by design
#                        (reason, and the ledger page that says why)
#   skipped              not imported, by design (reason, ledger page)
#   missing              not mentioned here — the to-do list
#
# Failing is never written here: the generator runs the specs and decides.
# Missing is never written here either: it is every file this does not name.
#
# Keys are paths inside the ruby/spec checkout. A key ending in `/` covers a
# whole directory and every spec file under it (skips by doctrine only). A
# file-level key wins over the directory it sits in. Where one upstream file
# is spread over several pdx specs, or several upstream files share one, each
# upstream file is its own entry.
#
# `link` is a path in this repo (docs/ruby/..., docs/adr/...) or an issue
# URL. An intentional partial or a skip without one is a ledger gap: the
# reason is real and the ledger page has not been written yet.

