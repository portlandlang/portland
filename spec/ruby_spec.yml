# — skipped by doctrine, whole directories —

core/class/:
  status: skipped
  reason: "These specs test Class as a runtime object — Class.new, allocate, superclass, subclasses, inherited — which is runtime metaprogramming. The class keyword itself is a spelling of struct (ADR 0056)."
  link: docs/ruby/metaprogramming.md
core/conditionvariable/:
  status: skipped
  reason: "No Thread and its primitives: concurrency is together and meanwhile."
  link: docs/ruby/concurrency.md
core/enumerator/:
  status: skipped
  reason: "There are no enumerators; methods that would answer one answer the finished collection."
