core/array/first_spec.rb:
  pdx: [spec/array/queries_spec.pdx, spec/array/ends_spec.pdx]
  status: partial_intentional
  reason: "Bare first answers a maybe: a partial operation never hands back a silent nil."
  link: docs/ruby/lookups.md
core/array/flatten_spec.rb:
  pdx: [spec/array/transforms_spec.pdx]
  status: partial_intentional
  reason: "flatten! stays behind: values never mutate."
