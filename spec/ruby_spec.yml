# The mutators: values never mutate, names do (ADR 0015). Each rewrite
# rebinds a mutable name — `<<` and `[]=` survive as that sugar.
core/array/append_spec.rb:
  status: skipped
  reason: "append mutates its receiver, and values never mutate (ADR 0015); list << item rebinds a mutable name instead."
  link: docs/ruby/mutability.md
core/array/push_spec.rb:
