name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cibuild:
    # Apple-silicon language, Apple-silicon runner. macOS 26+ only.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          # The builtin-table step diffs against the base, so it needs history.
          fetch-depth: 0
      # Reads .ruby-version. The runner ships an older Ruby than the doc
      # checks require, and `mdl` has to come from the lockfile rather than
      # whatever happens to be installed.
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      # The Rust toolchain rust-toolchain.toml pins would otherwise download
      # through rustup on every run; the key is the pin file, so bumping the
      # version is what refreshes the cache.
      - uses: actions/cache@v6
        with:
          path: ~/.rustup
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      - run: script/cibuild
      # The builtin method table (#88) in compiler/inference.pdx is derived
      # from the seed's behavior: re-derive it and diff, about five minutes,
      # only when the seed, the table, or the probe changed against the base.
      # A manual run, or a base this checkout cannot see, always checks.
      - name: builtin method table
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || ! git cat-file -e "$BASE^{commit}" 2> /dev/null; then
            changed=all
          else
            changed=$(git diff --name-only "$BASE"...HEAD -- seed/src compiler/inference.pdx script/probe_builtin_methods script/check_builtin_table)
          fi
          if [ -z "$changed" ]; then
            echo "seed, table, and probe unchanged — skipped"
            exit 0
          fi
          . script/lib/rust.sh
          cargo build --quiet
          ruby script/check_builtin_table
