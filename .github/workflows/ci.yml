name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One check per thing a change is held to (#603), each running one step of
# script/test, so a red check names what failed and the others still run.
# The build job compiles once and hands what it built to every check that
# runs tests; format needs no build and starts at once.
#
# Apple-silicon language, Apple-silicon runners. macOS 27+ only. GitHub's
# macOS 27 image is labelled for its Xcode, `xcode-27`, while in preview.

jobs:
  format:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          target: "false"
      - run: script/test format

  # Clippy builds in its own way, checking rather than compiling, so it
  # gains nothing from the build job and runs beside it.
  clippy:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: script/test clippy

  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: script/test build
      # What the checks run, kept as a tar so the binaries stay executable
      # and cargo's times hold. Incremental state is for rebuilding, which
      # no check does.
      - run: tar -cf built.tar --exclude target/debug/incremental target/debug target/release/libportland_runtime.a
      - uses: actions/upload-artifact@v7
        with:
          name: built
          path: built.tar
          retention-days: 1

  check:
    needs: build
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        step:
          - unit
          - runtime
          - source-form
          - ruby-rules
          - integration
          - regex-corpus
          - regex-fuzz
          - lint
          - docs
          - whole-suites
          - native-tools
    name: ${{ matrix.step }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          target: "false"
      - uses: ./.github/actions/built
      # `script/docs/check closed_issue_claims` asks GitHub which issues are
      # closed, through `gh`, which reads this token.
      - run: script/test ${{ matrix.step }}
        env:
          GH_TOKEN: ${{ github.token }}

  # The builtin method table (#88) in compiler/inference.pdx is derived from
  # the seed's behavior: re-derive it and diff, about four minutes, only when
  # the seed, the table, the probe, or this workflow changed against the
  # base. A manual run, or a base this checkout cannot see, always checks.
  # It uses nothing the build job produces, so it is its own job and runs
  # beside the others rather than after them (#259).
  builtin-method-table:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          # The changed-paths gate diffs against the base, so it needs history.
          fetch-depth: 0
      - name: changed paths
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || ! git cat-file -e "$BASE^{commit}" 2> /dev/null; then
            changed=all
          else
            changed=$(git diff --name-only "$BASE"...HEAD -- seed/src compiler/inference.pdx script/probe_builtin_methods script/check_builtin_table .github/workflows/ci.yml)
          fi
          if [ -z "$changed" ]; then
            echo "seed, table, probe, and workflow unchanged — skipped"
            echo "check=false" >> "$GITHUB_OUTPUT"
          else
            echo "check=true" >> "$GITHUB_OUTPUT"
          fi
      # The same Ruby, caches, and toolchain as every check, set up only when
      # the table is to be checked, so a skipped run finishes in seconds.
      - if: steps.gate.outputs.check == 'true'
        uses: ./.github/actions/setup
      - name: builtin method table
        if: steps.gate.outputs.check == 'true'
        run: |
          . script/lib/rust.sh
          cargo build --quiet
          ruby script/check_builtin_table
