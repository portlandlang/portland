name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cibuild:
    # Apple-silicon language, Apple-silicon runner. macOS 26+ only.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      # Reads .ruby-version. The runner ships an older Ruby than the doc
      # checks require, and `mdl` has to come from the lockfile rather than
      # whatever happens to be installed.
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: script/cibuild
