[workspace]
resolver = "3"
members = ["crate", "runtime", "seed"]

# What the seed and the runtime both use is pinned here, once, so the two
# cannot carry different versions of one crate (ADR 0095).
[workspace.dependencies]
libc = "0.2.191"
# The Unicode floor for ADR 0038, shared so that a String is equal to
# another on the seed exactly when it is in a native binary.
unicode-normalization = "0.1.26"
unicode-segmentation = "1.13.3"

# The seed is an interpreter, and every test shells out to it: the suite's
# time is the seed's speed, not the tests'. Measured 2026-10-26 (#180), the
# hosted self-parse of parser.pdx took 9.9s unoptimized and 1.7s in release;
# `opt-level = 1` gets 2.0s of that for a build-after-edit of 3.8s instead
# of 1.1s. A rebuild costs about three seconds more; every run of the suite
# saves minutes. Debug assertions and debuginfo stay on.
[profile.dev]
opt-level = 1
